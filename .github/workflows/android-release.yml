name: TikSnap Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage existing release signing materials
        working-directory: source/TikSnap
        run: |
          test -f ../../signing-PRIVATE/keystore.properties
          test -f ../../signing-PRIVATE/tiksnap-release.jks
          mkdir -p signing
          cp ../../signing-PRIVATE/keystore.properties signing/keystore.properties
          cp ../../signing-PRIVATE/tiksnap-release.jks signing/tiksnap-release.jks
          test -s signing/keystore.properties
          test -s signing/tiksnap-release.jks

      - name: Stage README-specified ad images and poster headers
        working-directory: source/TikSnap
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/assets/feed
          cp ../../screenshot/screenshot_0[1-8].jpg app/src/main/assets/feed/
          cp ../../ad-assets/plain_image/Windex.jpg app/src/main/assets/feed/Windex.jpg
          cp ../../ad-assets/plain_image/McDonalds.jpg app/src/main/assets/feed/McDonalds.jpg
          cp ../../ad-assets/posters/Windex_header.jpg app/src/main/assets/feed/Windex_header.jpg
          cp ../../ad-assets/posters/McDonalds_header.jpg app/src/main/assets/feed/McDonalds_header.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          feed = Path("app/src/main/assets/feed")
          originals = {
              "Windex.jpg": Path("../../ad-assets/plain_image/Windex.jpg"),
              "McDonalds.jpg": Path("../../ad-assets/plain_image/McDonalds.jpg"),
              "Windex_header.jpg": Path("../../ad-assets/posters/Windex_header.jpg"),
              "McDonalds_header.jpg": Path("../../ad-assets/posters/McDonalds_header.jpg"),
          }

          for name, source in originals.items():
              staged = feed / name
              if not source.is_file() or not staged.is_file():
                  raise RuntimeError(f"Missing required README asset: {name}")
              if source.stat().st_size == 0 or staged.stat().st_size == 0:
                  raise RuntimeError(f"Empty README asset: {name}")
              with Image.open(source) as image:
                  image.verify()
              with Image.open(staged) as image:
                  image.verify()
              source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
              staged_hash = hashlib.sha256(staged.read_bytes()).hexdigest()
              if source_hash != staged_hash:
                  raise RuntimeError(f"{name} changed while being staged")
              print(f"Verified unchanged {name}")

          if len(list(feed.glob("screenshot_*.jpg"))) != 8:
              raise RuntimeError("Expected only the eight non-ad sample screenshots")
          print("README ad assets staged byte-for-byte unchanged.")
      - name: Build signed release APK
        working-directory: source/TikSnap
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK package, version, alignment, and signing certificate
        working-directory: source/TikSnap
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.bytesnap.tiksnap' versionCode='2' versionName='1.1.0'"
          SIGNATURE_REPORT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_REPORT"
          printf '%s\n' "$SIGNATURE_REPORT" | grep -F "TikSnap Release Signing"
          mkdir -p ../../dist
          cp "$APK" ../../dist/TikSnap-1.1.0-release.apk
          test -s ../../dist/TikSnap-1.1.0-release.apk

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiksnap-build-${{ github.run_number }}
          name: TikSnap 1.1.0 - Build ${{ github.run_number }}
          body: |
            Automated signed TikSnap 1.1.0 Android build.

            Download the APK asset below directly. No ZIP extraction is required.
          prerelease: true
          files: dist/TikSnap-1.1.0-release.apk
          fail_on_unmatched_files: true
