plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file('signing/keystore.properties')
if (!ksFile.exists()) {
    throw new GradleException("Release signing configuration is missing: ${ksFile}")
}
ksFile.withInputStream { ksProps.load(it) }
def ksPath = ksProps.getProperty('storeFile')
if (!ksPath) throw new GradleException("storeFile is not configured in keystore.properties")
def releaseKeystore = rootProject.file(ksPath)
if (!releaseKeystore.exists()) throw new GradleException("Configured release keystore does not exist: ${releaseKeystore}")
if (!ksProps.getProperty('keyAlias') || !ksProps.getProperty('storePassword') || !ksProps.getProperty('keyPassword')) {
    throw new GradleException("Release signing properties are incomplete")
}

android {
    namespace 'com.bytesnap.tiksnap'
    compileSdk 34
    defaultConfig {
        applicationId 'com.bytesnap.tiksnap'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword ksProps['storePassword']
            keyAlias ksProps['keyAlias']
            keyPassword ksProps['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
